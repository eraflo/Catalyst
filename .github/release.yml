changelog:
  exclude:
    labels:
      - ignore
    authors:
      - octocat
      - github-actions[bot]
  categories:
    - title: '### Added'
      labels:
        - feat
        - feature
        - enhancement
    - title: '### Changed'
      labels:
        - refactor
        - style
        - chore
    - title: '### Fixed'
      labels:
        - fix
        - bug
    - title: '### Security'
      labels:
        - security
    - title: '### Deprecated'
      labels:
        - deprecated
    - title: '### Removed'
      labels:
        - removed

# This helps GitHub map PR titles/labels to categories if they follow conventional commits
# but usually manual labeling or PR titles are used.
