name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  # Validate package structure
  validate:
    name: Validate Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package.json
        run: |
          if [ ! -f "package.json" ]; then
            echo "Error: package.json not found"
            exit 1
          fi

          # Check required fields
          jq -e '.name' package.json > /dev/null || (echo "Missing 'name' field" && exit 1)
          jq -e '.version' package.json > /dev/null || (echo "Missing 'version' field" && exit 1)
          jq -e '.displayName' package.json > /dev/null || (echo "Missing 'displayName' field" && exit 1)

          echo "✅ package.json is valid"

      - name: Check documentation exists
        run: |
          if [ ! -d "Documentation~" ]; then
            echo "⚠️ Warning: Documentation~ folder not found"
          else
            echo "✅ Documentation folder exists"
            ls -la Documentation~/
          fi

      - name: Check assembly definitions
        run: |
          if [ -f "Runtime/*.asmdef" ] || [ -f "Runtime/**/*.asmdef" ]; then
            echo "✅ Runtime assembly definition found"
          fi
          if [ -f "Editor/*.asmdef" ] || [ -f "Editor/**/*.asmdef" ]; then
            echo "✅ Editor assembly definition found"
          fi

  # Run tests using a temporary Unity project
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      # 1. Free Disk Space & Create Swap (Virtual RAM)
      # This prevents the "Exit Code 1" crash (OOM) occurring between license check and testing start
      - name: Free Disk Space & Create Swap
        run: |
          # Free up space for the swap file
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Create a 4GB Swap file to act as extra RAM
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # 2. Create the test project structure first (needed before cache restoration)
      - name: Create test project
        run: |
          mkdir -p TestProject/Assets
          mkdir -p TestProject/Packages
          mkdir -p TestProject/ProjectSettings

          # Create manifest.json
          cat > TestProject/Packages/manifest.json << 'EOF'
          {
            "dependencies": {
              "com.eraflo.catalyst": "file:../../package",
              "com.unity.test-framework": "1.3.9",
              "com.unity.modules.animation": "1.0.0",
              "com.unity.modules.ai": "1.0.0",
              "com.unity.modules.physics": "1.0.0",
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.unitywebrequest": "1.0.0",
              "com.unity.modules.audio": "1.0.0"
            },
            "testables": ["com.eraflo.catalyst"]
          }
          EOF

          # Create ProjectVersion.txt
          cat > TestProject/ProjectSettings/ProjectVersion.txt << EOF
          m_EditorVersion: 2022.3.62f1
          m_EditorVersionWithRevision: 2022.3.62f1 (0000000000000)
          EOF

          # Create ProjectSettings.asset
          cat > TestProject/ProjectSettings/ProjectSettings.asset << 'EOF'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            productName: TestProject
            companyName: Test
          EOF

      # 3. Restore the cache AFTER creating the folders
      # This ensures Unity doesn't have to rebuild the Library from scratch every time
      - uses: actions/cache@v3
        with:
          path: TestProject/Library
          # Added manifest.json hash: invalidates cache if dependencies change
          key: Library-Test-${{ hashFiles('package/**/*.cs', 'package/**/*.asmdef', 'TestProject/Packages/manifest.json') }}
          restore-keys: |
            Library-Test-

      # 4. Run the Unity Tests
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_DISABLE_BURST: "1"
        with:
          unityVersion: 2022.3.62f1
          projectPath: TestProject
          testMode: all
          artifactsPath: TestResults
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test Results
          useHostNetwork: true
          customParameters: -logFile - -nographics -batchmode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results
          path: TestResults

  # Semantic Release
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 19
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}